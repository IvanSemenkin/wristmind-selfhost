[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wristmind-server"
version = "1.0.0"
description = "WristMind multimodal assistant API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "firebase-admin>=6.9,<8",
  "curl-cffi>=0.14,<1",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "pgvector>=0.4,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "pillow>=11.3,<12",
  "pytesseract>=0.3.13,<1",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/wristmind_server"]
