# WristMind edge server — HTTPS with an ACME certificate.
#
# Rendered by `./wristmind tls` from this template: every `__WM_DOMAIN__` is
# replaced with the chosen host. The rendered copy lives in server/tls/ and is
# not tracked by Git.
#
# Port 80 only redirects and serves ACME challenges; port 443 is the API and
# the panel. The certificate is read from /etc/letsencrypt/live/__WM_DOMAIN__.

server {
    listen 80;
    server_name __WM_DOMAIN__;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __WM_DOMAIN__;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/__WM_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__WM_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WristMindTLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        set $wristmind_api http://api:8000;
        proxy_pass $wristmind_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        add_header X-Accel-Buffering no;
    }
}
