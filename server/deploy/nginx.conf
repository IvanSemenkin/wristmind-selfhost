# WristMind edge server — plain HTTP.
#
# This is the default state of a fresh install: the API is reachable over HTTP,
# which is enough for the web panel. Watches require HTTPS, so a real install
# adds a certificate and switches to the rendered nginx.tls.conf.
#
# The ACME challenge location is present from the start, so a certificate can
# be issued without editing this file.
server {
    listen 8080;
    server_name _;
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        set $wristmind_api http://api:8000;
        proxy_pass $wristmind_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        add_header X-Accel-Buffering no;
    }
}
